name: Build GKI NetHunter Kernel

on:
  push:
    branches:
      - sm7325/v/mr
  pull_request:
    branches:
      - sm7325/v/mr
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      O: out
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # 1️⃣ Clonar el repo en la rama actual
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: sm7325/v/mr

      # 2️⃣ Instalar dependencias básicas
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libncurses5-dev libssl-dev wget zip unzip git ccache

      # 3️⃣ Cache de ccache entre builds
      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/nos3_nh_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 4️⃣ Descargar y configurar Clang 10.0.9
      - name: Setup Clang
        run: |
          mkdir -p $HOME/toolchains/clang
          wget -qO clang.tar.gz https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/llvm-arm-toolchain-ship-10.0.9.tar.gz
          tar xf clang.tar.gz -C $HOME/toolchains/clang
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH
          echo "CC=ccache clang" >> $GITHUB_ENV
          echo "CXX=ccache clang++" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # 5️⃣ Descargar y configurar GCC 4.9 cross-compiler
      - name: Setup GCC cross-compiler
        run: |
          mkdir -p $HOME/toolchains/gcc
          wget -qO gcc.tar.gz https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/aarch64-linux-android-4.9-Linux-5.4.tar.gz
          tar xf gcc.tar.gz -C $HOME/toolchains/gcc
          echo "CROSS_COMPILE=$HOME/toolchains/gcc/bin/aarch64-linux-android-" >> $GITHUB_ENV

      # 6️⃣ Configurar kernel con nos3_nh_defconfig
      - name: Kernel config
        run: |
          make O=$O ARCH=$ARCH nos3_nh_defconfig

      # 7️⃣ Compilar kernel y módulos
      - name: Build kernel and modules
        run: |
          make -j$(nproc) O=$O ARCH=$ARCH CC="$CC" CROSS_COMPILE=$CROSS_COMPILE

      # 8️⃣ Preparar AnyKernel
      - name: Package AnyKernel
        run: |
          mkdir -p AnyKernel/modules
          cp $O/arch/arm64/boot/Image.gz AnyKernel/
          cp -r $O/lib/modules/* AnyKernel/modules/ || true
          cd AnyKernel && zip -r ../nethunter_kernel.zip *

      # 9️⃣ Subir ZIP como artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: nethunter_kernel
          path: nethunter_kernel.zip
